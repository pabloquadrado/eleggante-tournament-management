services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: arena_local
      POSTGRES_DB: arena_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arena -d arena_dev']
      interval: 5s
      timeout: 3s
      retries: 10

  mail:
    image: axllent/mailpit:latest
    ports:
      - '127.0.0.1:8025:8025'

  app:
    build: .
    command: ['sh', '-c', 'node ace migration:run --force && node ace serve --hmr']
    environment:
      HOST: 0.0.0.0
      APP_URL: http://localhost:3333
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: arena
      DB_PASSWORD: arena_local
      DB_DATABASE: arena_dev
      QUEUE_DRIVER: database
    ports:
      - '127.0.0.1:3333:3333'
      - '127.0.0.1:5173:5173'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      database:
        condition: service_healthy
      mail:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3333/api/v1/tournaments').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 15

  worker:
    build: .
    command: ['node', 'ace', 'queue:work']
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: arena
      DB_PASSWORD: arena_local
      DB_DATABASE: arena_dev
      QUEUE_DRIVER: database
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      app:
        condition: service_healthy

  tests:
    profiles: ['test']
    build:
      context: .
      dockerfile: Dockerfile.test
    command:
      ['sh', '-c', 'node ace migration:run --force && npm run build && npm run test:coverage']
    environment:
      NODE_ENV: test
      HOST: 0.0.0.0
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: arena
      DB_PASSWORD: arena_local
      DB_DATABASE: arena_test
      QUEUE_DRIVER: sync
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      database:
        condition: service_healthy

volumes:
  postgres_data:
  node_modules:
