name: Tests and coverage

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arena
          POSTGRES_PASSWORD: ci-only-test-password
          POSTGRES_DB: arena_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arena -d arena_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: 3333
      LOG_LEVEL: info
      APP_NAME: Arena Eleggante
      APP_URL: http://127.0.0.1:3333
      SESSION_DRIVER: memory
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: arena
      DB_PASSWORD: ci-only-test-password
      DB_DATABASE: arena_test
      QUEUE_DRIVER: sync
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        run: docker run --rm --volume "$PWD:/repo:ro" --workdir /repo ghcr.io/gitleaks/gitleaks:v8.30.1 git --log-opts=--all --redact=100 --no-banner .
      - name: Generate ephemeral test app key
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node ace migration:run --force
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
